services:
  - type: web
    name: multi-agent-business-intelligence
    runtime: python
    buildCommand: "pip install uv && uv sync"
    startCommand: "chainlit run main.py --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CHAINLIT_AUTH_SECRET
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: business-research-assistant
